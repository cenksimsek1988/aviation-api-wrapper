# Settings are in .properties, not YAML: one key per line is easy to read, to compare and to edit with shell scripts.
# Only values that differ from Spring Boot's defaults are set here.

spring.application.name=aviation-api-wrapper
spring.mvc.problemdetails.enabled=true
# Behind a load balancer or ingress, the client address comes from X-Forwarded-For, trusted only when the proxy is on
# a private network (Tomcat's default list). It feeds the session hash in the logs (RequestIdFilter).
server.forward-headers-strategy=native

# Authorization: each endpoint names its authority (@PreAuthorize). There is no login yet, so every caller is
# anonymous and gets these authorities: everyone may read for now. "SCOPE_airports:read" is the authority Spring
# Security makes from an OAuth2 token with the scope "airports:read", so tokens work unchanged once a login is added.
api.security.anonymous-authorities=SCOPE_airports:read
# No login means no users: skip the generated in-memory user and its password log line.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Local airport cache. How long an entry stays fresh is the provider's own Cache-Control max-age, per answer.
airport.cache.max-size=10000
airport.cache.keep-stale-for=7d

# Outgoing HTTP uses the JDK's own client: no extra library, and no retries we did not ask for. Set explicitly, so a
# client library that appears on the classpath cannot replace it (Apache HttpClient comes with WireMock in the tests,
# and its default would repeat a 429 once).
spring.http.clients.imperative.factory=jdk

# aviationweather.gov (Aviation Weather Center, "awc"). HTTP settings of its HTTP service group:
spring.http.serviceclient.awc.base-url=https://aviationweather.gov
spring.http.serviceclient.awc.connect-timeout=1s
spring.http.serviceclient.awc.read-timeout=2s
spring.http.serviceclient.awc.default-header.[User-Agent]=aviation-api-wrapper/1.0 (+https://github.com/cenksimsek1988/aviation-api-wrapper)
# Its published rate limit, copied as is: 100 requests per minute. We use half of it (see ProviderLimit), and one
# failure pauses an endpoint for the same period. With several instances, divide it by their number
# (docs/next-steps.md).
provider.awc.rate-limit.calls=100
provider.awc.rate-limit.period=60s
# Fresh time for an answer that comes without Cache-Control max-age.
provider.awc.default-fresh-for=1h
# Largest JSON answer read from any provider: one airport is under 1 KB, so a bigger answer is broken and refused (503).
# The HTTP clients have no per-request size limit, so this one applies to every provider answer; raise it when an
# endpoint with larger answers is added.
spring.jackson.factory.constraints.read.max-document-length=100000

# Circuit breakers: one per endpoint of each provider (ProviderGuard); one failure opens it, the pause is the
# provider's rate-limit period, then the next call is the test.
resilience4j.circuitbreaker.configs.default.sliding-window-size=1
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=1
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=100
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.configs.default.record-exceptions[0]=io.github.cenksimsek1988.aviation.provider.ProviderUnavailableException
resilience4j.circuitbreaker.configs.default.record-exceptions[1]=io.github.cenksimsek1988.aviation.provider.ProviderBrokenException
resilience4j.circuitbreaker.configs.default.ignore-exceptions=io.github.resilience4j.ratelimiter.RequestNotPermitted
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
# Show the state, but never mark this service DOWN for a provider's outage: the cache can still answer.
resilience4j.circuitbreaker.configs.default.allow-health-indicator-to-fail=false
# Retries: only a call that never reached the provider, so a retry cannot count twice against its limit. Three
# attempts (Resilience4j's default), 200 ms apart.
resilience4j.retry.instances.awc.wait-duration=200ms
resilience4j.retry.instances.awc.retry-exceptions=io.github.cenksimsek1988.aviation.provider.ProviderUnreachableException

# Management port: health details, metrics, Prometheus, and log levels changeable at runtime (loggers). It must stay
# internal: never publish it outside the host or cluster (compose.yaml binds it to this computer).
management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always
# Liveness and readiness also on the API port (/livez, /readyz), so a probe still tests the port that serves traffic.
management.endpoint.health.probes.add-additional-paths=true
management.health.circuitbreakers.enabled=true

# API docs stay on: the API is public by design and the docs describe its contract.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Error answers are problem details (RFC 9457); the exception handler names no media type, so it is set here.
springdoc.default-produces-media-type=application/problem+json

# Every log line of a request carries the caller's session (a hash, never the address) and the request ID.
logging.pattern.correlation=%([%X{session} %X{requestId}] )
# AirportService logs a failed refresh itself; Caffeine's own warning would repeat it.
logging.level.com.github.benmanes.caffeine=ERROR
